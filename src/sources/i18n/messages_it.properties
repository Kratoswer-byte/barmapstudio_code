zm.1=MATERIALI ESTERNI - SPECIFICHE\n
zm.2=Un materiale e' un gruppo di file con lo stesso nome base, nella stessa cartella\n
zm.3=(consigliata: custom_assets/textures). Si carica scegliendo il file del COLORE.\n
zm.4=\  lana.png            COLORE (obbligatorio)\n
zm.5=\  lana_normal.png     NORMAL MAP (facoltativo)\n
zm.6=\  lana_height.png     RILIEVO in scala di grigi (facoltativo)\n
zm.7=\  lana.properties     PARAMETRI (facoltativo)\n
zm.8=PACCHETTI PBR GIA' PRONTI (ambientCG, Poly Haven)\n
zm.9=Si caricano cosi' come sono, scegliendo il file _Color: vengono riconosciuti\n
zm.10=_Color, _NormalGL (o _NormalDX, convertita), _Displacement (rilievo) e\n
zm.11=_Roughness (da cui si stima la lucentezza). Il rilievo vero resta spento finche'\n
zm.12=non imposti relief_elmos in <nome>.properties.\n
zm.13=REGOLE PER LE IMMAGINI\n
zm.14=- Formato: PNG, JPG o BMP.\n
zm.15=- Quadrate, lato potenza di 2: 256, 512, 1024 o 2048.\n
zm.16=- Ripetibili senza giunte (seamless): il bordo destro deve continuare nel sinistro,\n
zm.17=\  quello alto nel basso.\n
zm.18=- Colore: senza ombre o luci direzionali, il motore le aggiunge da solo.\n
zm.19=- Normal map: tangent space, convenzione OpenGL (verde = alto), stessa ripetizione del colore.\n
zm.20=\  Se manca viene ricavata dal rilievo o dalla luminosita' del colore.\n
zm.21=- Rilievo: grigio medio = quota invariata, bianco = alza, nero = abbassa.\n
zm.22=PARAMETRI (file .properties, tutti facoltativi)\n
zm.23=\  tile_elmos=128      lato di una ripetizione sul terreno, in elmi (16 - 2048)\n
zm.24=\  gloss=0.05          lucentezza: 0 = opaco (lana), 0.6 = plastica lucida (Lego)\n
zm.25=\  relief_elmos=0      dislivello del rilievo vero in elmi, dal punto piu' basso al piu' alto\n
zm.26=\  normal_strength=2   forza della normal map (1 = come nel file, fino a 8)\n
zm.27=LIMITI DEL GIOCO\n
zm.28=- Il colore in gioco ha 1 pixel per elmo: un tile 1024 px su 128 elmi viene ridotto.\n
zm.29=- Il rilievo vero ha 1 punto ogni 8 elmi: serve tile_elmos di almeno 64 e forme larghe\n
zm.30=\  almeno 40-50 elmi. Le unita' lo sentono: rilievi ripidi le rallentano o le bloccano.\n
zm.31=- Il dettaglio fine (fibre, bordi) arriva dalla normal map, non dal rilievo.\n
zm.32=\ sembra l'anteprima del pacchetto: uso 
zm.33=\ come colore.
zm.34=relief_elmos > 0 ma manca 
zm.35=_height: nessun rilievo applicato.
zm.36=Rilievo con tile_elmos < 64: il terreno ha un punto ogni 8 elmi, il rilievo verra' ignorato.
zm.37=Impossibile leggere 
zm.38=: non e' quadrata (
zm.39=), verra' deformata.
zm.40=: il lato non e' una potenza di 2 (
zm.41=: piu' grande di 2048 px, il dettaglio in eccesso non si vede in gioco.
