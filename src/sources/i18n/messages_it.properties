spec.1=Non mostrare piu all'avvio
spec.2=SPECIFICHE & GUIDA ASSET: BEYOND ALL REASON
spec.3=SPECIFICHE & GUIDA ASSET: BEYOND ALL REASON (RECOIL ENGINE)
spec.4=HEIGHTMAP & RILIEVI
spec.5=TEXTURE & TERRENO
spec.6=MODELLI 3D & FLORA
spec.7=METALLO & AMBIENTE
spec.8=CARTELLA ASSET
spec.9=SPECIFICHE ALTIMETRIA E HEIGHTMAP (RECOIL ENGINE)
spec.10=Formato Primario
spec.11=PNG 16-bit Grayscale o RAW 16-bit
spec.12=Profondita Colore
spec.13=65.536 Livelli di grigio (0 - 65535)
spec.14=Risoluzione Formula
spec.15=Pendenza Max Carri
spec.16=fino a ~27 gradi (movedef 18 x 1.5); consigliato < 20
spec.17=Pendenza Max Bot
spec.18=fino a ~54 gradi (movedef 36 x 1.5); consigliato < 33
spec.19=Risoluzioni Standard per BAR
spec.20=> Mappa 8x8 km (1v1 / 2v2): 513 x 513 pixel (o 512x512)\n
spec.21=> Mappa 16x16 km (Standard 8v8 competitivo): 1025 x 1025 pixel (o 1024x1024)\n
spec.22=> Mappa 24x24 km (Ampia scala): 1537 x 1537 pixel\n
spec.23=> Mappa 32x32 km (Guerra totale): 2049 x 2049 pixel\n\n
spec.24=Nota: Se importi immagini con risoluzione diversa (es. 2000x2000 o 1920x1080), BAR Map Studio applica automaticamente un ricampionamento bicubico con preservazione dei dislivelli.
spec.25=PERCHE IL FORMATO 16-BIT E FONDAMENTALE:\n
spec.26=Un'immagine 8-bit convenzionale dispone solo di 256 livelli discreti. Su un dislivello di 300 metri, ogni gradino misura oltre 1,17 metri, generando terrazzamenti a gradoni ('stepping/banding') che incastrano i veicoli di BAR.\n
spec.27=Il 16-bit offre 65.536 quote diverse (4,5 millimetri per livello), garantendo rampe perfettamente lisce ed un pathfinding fluido per tutti i veicoli.
spec.28=ERRORI COMUNI DA EVITARE:\n
spec.29=[!] Pendenze verticali accidentali: Usa sempre lo strumento Slope Map [L] per verificare che le rampe di accesso alle basi non superino i 22 gradi per i carri.\n
spec.30=[!] Picchi isolati sotto acqua: I fondali marini devono avere un fondo piatto o degradante per consentire il passaggio di hovercraft e sottomarini.
spec.31=SPECIFICHE TEXTURE DI SUPERFICIE E SPLATTING
spec.32=Risoluzione Tessere
spec.33=Formato Diffuse Globale
spec.34=DDS compresso BC1/DXT1 o PNG 24-bit
spec.35=Detail Normals (DNTS)
spec.36=TGA 32-bit non compresso (1024x1024)
spec.37=Splatting Mask
spec.38=DDS BC3/DXT5 a 4 Canali RGBA
spec.39=Seamless (Ripetizione continua senza cuciture)
spec.40=I 4 Canali della Maschera di Splatting (_splats.dds)
spec.41=Lo shader del terreno di Beyond All Reason fonde 4 texture di micro-dettaglio (DNTS) attraverso i canali della mappa di splatting:\n
spec.42=> Canale R (Rosso): Materiale 1 (Terreno base, erba, pianura)\n
spec.43=> Canale G (Verde): Materiale 2 (Pareti rocciose, falesie, scarpate verticali)\n
spec.44=> Canale B (Blu): Materiale 3 (Sabbia, ghiaia, fondale marino o litorale)\n
spec.45=> Canale A (Alpha): Materiale 4 (Neve, fango, crepe o polvere d'alta quota)\n\n
spec.46=I valori variano da 0 a 255 e lo shader calcola automaticamente la transizione morbida tra i diversi strati.
spec.47=DETAIL NORMAL & TEXTURE (File _dnts1..4.tga):\n
spec.48=Risoluzione standard: 1024x1024 pixel. I canali contengono:\n
spec.49=- R (Rosso) = Vettore normale tangenziale X (nx)\n
spec.50=- G (Verde) = Vettore normale tangenziale Y (ny)\n
spec.51=- B (Blu) = Vettore normale tangenziale Z (nz = 1.0)\n
spec.52=- Alpha (Trasparenza) = Mappa di altezza e rugosita di micro-dettaglio (High-Pass Detail Heightpass)
spec.53=Materiali Esterni per le 4 Zone (pannello Texture, pulsante + File)
spec.54=Un materiale e un gruppo di file con lo stesso nome base nella stessa cartella. Si carica scegliendo il file del colore.\n
spec.55=> nome.png: COLORE (obbligatorio). Senza ombre o luci dipinte.\n
spec.56=> nome_normal.png: NORMAL MAP (facoltativo), tangent space OpenGL. Se manca viene ricavata.\n
spec.57=> nome_height.png: RILIEVO in grigi (facoltativo). Grigio medio = quota invariata, bianco alza, nero abbassa.\n
spec.58=> nome.properties: PARAMETRI (facoltativo): tile_elmos (16-2048, default 128), gloss (0-1, default 0.05), relief_elmos (0-64, default 0).\n
spec.59=> Immagini quadrate, lato potenza di 2 (256-2048), ripetibili senza giunte.\n
spec.60=> gloss: 0 = opaco (lana), 0.6 = plastica lucida (Lego).\n
spec.61=> Rilievo vero: il terreno ha un punto ogni 8 elmi, servono tile_elmos di almeno 64 e forme larghe 40-50 elmi. Le unita lo sentono.\n
spec.62=> In export il colore viene composto a piena risoluzione (1 pixel per elmo) da maschere e materiali.
spec.63=ERRORI COMUNI SULLE TEXTURE:\n
spec.64=[!] Neri puri (#000000) o Bianchi puri (#FFFFFF): Sovrascrivono la luce solare dello shader di BAR rendendo le ombre piatte o bruciate.\n
spec.65=[!] Dimensioni non potenze di 2: La GPU non puo generare mipmaps per dimensioni asimmetriche (es. 1000x1000), causando artefatti visivi da lontano.
spec.66=SPECIFICHE MODELLI 3D, FLORA E RELITTI (FEATURES)
spec.67=Formato 3D Nativo
spec.68=Spring .s3o (Convertibile da .OBJ)
spec.69=Flora (Alberi/Arbusti)
spec.70=150 - 500 Triangoli (Max 800)
spec.71=Rocce & Massi
spec.72=Relitti Grandi / Landmark
spec.73=Texture Atlas
spec.74=Potenza di 2 (512, 1024, 2048): TGA/PNG o DDS
spec.75=Import OBJ: come arriva il modello in gioco
spec.76=BAR non legge i file .mtl ne le texture map_Kd: lo Studio converte l'OBJ in un .s3o (objects3d/) con UNA sola coppia di texture in unittextures/.\n
spec.77=> Materiali con solo colore (Kd): diventano una palette di colori.\n
spec.78=> Materiali con immagine (map_Kd): vengono fusi in un unico atlante; tieni .obj, .mtl e immagini nella stessa cartella.\n
spec.79=> Geometria: asse Y verso l'alto. Lo Studio centra il modello e ne appoggia la base al terreno (Y = 0).\n
spec.80=> Scala: 1 casella di footprint = 16 elmi. Campo scala da 0.01 a 500.
spec.81=CANALI DELLE DUE TEXTURE (regola dello shader di BAR):\n
spec.82=- tex1 RGB: colore del modello.\n
spec.83=- tex1 Alpha: quantita di COLORE SQUADRA. 0 = colori originali, 255 = modello tutto del colore squadra.\n
spec.84=- tex2 R: emissione (luci), G: metallo, B: ruvidita.\n
spec.85=- tex2 Alpha: opacita. Deve essere 255 dove il modello e visibile.\n
spec.86=- UV: v = 0 e il bordo ALTO dell'immagine (contrario dell'OBJ; lo Studio inverte da solo).\n
spec.87=- Normal map (opzionale): file <nome tex1>_normals oppure customParams.normaltex.
spec.88=Statico o Dinamico
spec.89=> STATICO (feature): rocce, rovine, decorazioni, relitti. File features/<id>.lua, nessuna squadra, nessuna animazione. Il nome non deve contenere _dead o _heap.\n
spec.90=> DINAMICO (unita): torrette, edifici che girano, oggetti interattivi. File units/<id>.lua piu uno script in scripts/<id>.lua.\n
spec.91=> Animazioni: in BAR non sono scheletriche. Sono movimenti di PEZZI rigidi (base, torretta, canna...) comandati dallo script con Turn, Move, Spin, Hide, Show. Ogni pezzo ruota attorno alla propria origine.\n
spec.92=> Pezzi: ogni oggetto dell'OBJ (in Blender: un oggetto per parte, es. body, left_arm, right_arm) diventa un pezzo animabile. La radice e 'body' e il perno degli altri e il punto di attacco al corpo.\n
spec.93=> Script: se accanto a modello.obj c'e modello.lua viene caricato da solo all'import.\n
spec.94=> Arma: una riga di commento nello script, es.  --@weapon missile range=900 reload=2.5 damage=120  (missile = insegue, rocket = va dritto).\n> Indistruttibile: la riga di commento  --@invulnerable  nello script rende l'unita immune a ogni arma (D-gun compreso), non catturabile e non riciclabile.
spec.95=Budget Poligonale: Perche e Cruciale in BAR
spec.96=Una tipica mappa competitiva di Beyond All Reason ospita tra 5.000 e 20.000 alberi e formazioni rocciose.\n
spec.97=Se un singolo albero avesse 3.000 poligoni, l'engine dovrebbe renderizzare fino a 60 MILIONI di triangoli solo per la vegetazione, provocando cali devastanti di FPS.\n
spec.98=Usa geometrie low-poly con texture atlas ben pianificate e dettagli affidati alla normal map.
spec.99=SCHEMA DEFINIZIONE LUA (features/<nome_feature>.lua):\n
spec.100=Ogni oggetto 3D deve avere uno script .lua di accompagnamento con i seguenti parametri chiave:\n
spec.101=- name: stringa identificativa univoca\n
spec.102=- object: nome del file .s3o relativo a objects3d/, con estensione (es. 'albero_pino.s3o')\n
spec.103=- blocking: true (ostacola il moto) / false (schiacciabile dai carri)\n
spec.104=- reclaimable: true (i costruttori possono assorbire metallo/energia)\n
spec.105=- energy: valore energia estraibile (es. 40-70 per alberi)\n
spec.106=- metal: valore metallo estraibile (es. 100-300 per relitti)\n
spec.107=- damage: punti ferita prima della distruzione\n
spec.108=- flammable: true se puo prendere fuoco (la chiave 'burnable' viene ignorata)\n
spec.109=- footprintX / footprintZ: ingombro in caselle griglia (1 footprint = 16x16 elmos)
spec.110=CONSIGLI SULLE UV E I MATERIALI:\n
spec.111=[!] Piu texture separate per un solo albero: Usa un unico Texture Atlas per tronco e foglie per ridurre i draw call al minimo.\n
spec.112=[!] Normali non invertite: Recoil Engine utilizza normal maps tangent space con orientamento asse Y conforme a OpenGL.
spec.113=SPECIFICHE RISORSE (METALLO) E MAPINFO.LUA
spec.114=Risoluzione Metalmap
spec.115=1 Pixel ogni 16x16 Elmos (Griglia 1:16)
spec.116=Valore Metallo Mex
spec.117=0 - 255 (Standard BAR: ~180 - 255)
spec.118=Distanza Minima Mex
spec.119=48 - 64 Elmos (Evita sovrapposizione cerchi)
spec.120=Vento Standard
spec.121=Min: 4 - 6 | Max: 18 - 25
spec.122=Gravita di Gioco
spec.123=Mappe esportate: 100 (regolabile in Opzioni mappa)
spec.124=Bilanciamento Strategico dei Punti Metallo (Mex)
spec.125=> Base di Partenza: In genere 3 o 4 punti Mex (valore 1.5 - 2.0 metal/sec) difendibili entro 150 elmos dal Commander spawn.\n
spec.126=> Espansione Naturale: 2 o 3 punti Mex a media distanza che incoraggiano la contesa territoriale.\n
spec.127=> Punti Strategici al Centro: Spot ad alto rendimento (valore 3.0 - 5.0 metal/sec o geovent) situati in alture o gole per premiare l'aggressivita.\n
spec.128=> Simmetria Assoluta: Nei match competitivi, le posizioni e il valore complessivo di metallo devono essere perfettamente speculari (Asse X, Z o Diagonale).
spec.129=ILLUMINAZIONE E SOLE (In mapinfo.lua):\n
spec.130=- Inclinazione solare ottimale: Tra 35 e 55 gradi sull'orizzonte. Crea ombre lunghe e suggestive che valorizzano canyon e scarpate senza rendere buie le basi.\n
spec.131=- Rapporto Luce/Ombra: Luce d'ambiente ~0.35-0.45 per garantire piena leggibilita visiva delle unita anche nelle gole profonde.
spec.132=ACQUA (blocco 'water' di mapinfo.lua):\n
spec.133=- L'acqua NON e una texture della mappa: il motore la disegna da solo come piano a quota 0.\n
spec.134=- Tutto il terreno sotto quota 0 e sommerso; la texture della mappa copre solo il fondale.\n
spec.135=- Colore e trasparenza si regolano in mapinfo.lua (surfaceColor, surfaceAlpha, absorb, baseColor, planeColor).\n
spec.136=- La zona 'Costa / Spiaggia' del pannello Texture dipinge la fascia attorno alla quota dell'acqua.
spec.137=STRUTTURA CARTELLE PER ASSET PERSONALIZZATI
spec.138=BAR Map Studio include una cartella 'custom_assets/' predisposta nella radice dell'applicazione dove puoi depositare i tuoi file personali:\n\n
spec.139=[DIR] custom_assets/\n
spec.140=\  |-- [DIR] heightmaps/  -> Deposita qui le tue immagini PNG 16-bit o RAW di rilievo\n
spec.141=\  |-- [DIR] textures/    -> Deposita qui texture diffuse, normali e maschere splat\n
spec.142=\  `-- [DIR] features/    -> Deposita qui i modelli 3D (.obj con il suo .mtl) e gli script (.lua)\n\n
spec.143=Come vengono utilizzati:\n
spec.144=1. Le heightmap si caricano dal pulsante 'Carica Heightmap...' nella scheda Rilievo della barra sinistra.\n
spec.145=2. Le texture caricate sostituiscono in tempo reale la pavimentazione nell'anteprima e vengono impacchettate nelle tessere esportate.\n
spec.146=3. I modelli e gli oggetti 3D vengono inseriti automaticamente nell'archivio .sdz autosufficiente della mappa durante l'esportazione finale per Beyond All Reason.
spec.147=APRI CARTELLA 'custom_assets' IN WINDOWS EXPLORER
spec.148=Impossibile aprire la cartella custom_assets:\n
