specx.relief.title=Modellazione del rilievo in tempo reale (scheda Rilievo)
specx.relief.body=> Quota massima e livello dell'acqua hanno un cursore ciascuno: il terreno si rigenera mentre lo muovi.\n> Cursori di modellazione: profilo del rilievo, levigatura, terrazze (2-12 livelli), erosione, dettaglio fine, altezza dei bordi.\n> Lavorano sempre sul terreno originale, quindi gli effetti non si accumulano; a 0 torna com'era.\n> Generare, importare, caricare una heightmap o levigare le pendenze fissa un nuovo terreno di partenza e azzera i cursori.\n> Dopo le terrazze controlla la Slope Map [L]: i gradoni sono ripidi.
specx.import.title=Import di una mappa BAR esistente
specx.import.body=> 'Importa mappa BAR...' carica un .sd7/.sdz come base modificabile: terreno, texture colore (ridotta), punti di partenza, punti metallo, geyser, luce e acqua.\n> Non importati: alberi, rocce e relitti, le texture di dettaglio dell'autore, gli effetti speciali.\n> La texture colore viene importata a un quarto della risoluzione, quindi il terreno riesportato e piu sfocato da vicino.\n> Una mappa importata resta opera del suo autore: controlla la licenza prima di ripubblicarla.
specx.biome.title=Biomi BAR (menu Bioma / Texture)
specx.biome.body=> Le voci che iniziano con 'BAR:' vengono da mappe ufficiali di BAR: tavolozza del terreno (pianura, quota, pendii, roccia, riva, fondale), luce, atmosfera e acqua.\n> Contengono solo colori e numeri, nessuna texture degli autori; la mappa di origine viene scritta nel mapinfo.lua.\n> Se applichi i materiali di zona del pannello Texture, hanno la precedenza sui colori del bioma; luce e acqua restano.
specx.options.title=Opzioni mappa, giocatori e ruoli degli spawn
specx.options.body=> Giocatori per squadra (1-8): il generatore crea un punto di partenza per giocatore, ognuno con un colore diverso.\n> Opzioni mappa: niente nebbia di guerra, metallo/energia iniziali extra, terreno non deformabile, gravita, danno dell'acqua, acqua nascosta, vento, marea, raggio degli estrattori, mappa notturna, lava o acido al posto dell'acqua (quota, danno, marea).\n> Ruoli degli spawn (front, air, sea, tech): BAR li mostra come cerchi con la scritta prima della partita. Vengono scritti nello script di avvio, quindi funzionano quando la partita parte da BAR Map Studio; per le lobby online la mappa deve essere in maps-metadata di BAR (un file YAML pronto viene salvato nella mappa esportata, in mapconfig/).
specx.defaults.title=Oggetti in dotazione con il programma
specx.defaults.body=> Ogni sottocartella di 'default_objects/' nella cartella del programma che contiene un .obj (con il suo .mtl e, se serve, uno script .lua con lo stesso nome) viene caricata all'avvio come oggetto pronto.\n> Per aggiungere un tuo oggetto in dotazione crea una nuova sottocartella con quei file: non serve altro.
