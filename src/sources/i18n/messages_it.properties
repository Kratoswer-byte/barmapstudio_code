join.readme=Partita sulla mappa {0}\n\n1. Manda a ogni amico il file con il suo nome: join_NOME.bat per Windows, join_NOME.sh per Linux e Mac (non provato).\n2. L''amico apre il file con un doppio clic: scarica la mappa, la mette in BAR ed entra nella tua partita.\n   Windows può avvisare che il file è stato scaricato: Ulteriori informazioni, poi Esegui comunque.\n3. Tu ospiti: BAR parte sul tuo PC e aspetta gli altri.\n\nIndirizzo della partita: {1}, porta UDP {2}. Quella porta deve arrivare al tuo PC (inoltro sul router o rete privata).\nTutti devono avere il tuo stesso motore di BAR: {3}. Basta aprire BAR una volta per aggiornarlo.\nI file di ingresso contengono la password della partita: mandali solo ai tuoi amici.\n
