objhelp.button.tip=Quelle différence entre Behaviour et Definition ?
objhelp.title=Behaviour et Definition
objhelp.intro=Une unité personnalisée a deux textes Lua. Ils sont lus à deux moments différents et font deux travaux différents. Ils n'existent que pour vos copies : les unités originales de BAR sont en lecture seule.
objhelp.b.title=BEHAVIOUR : ce que fait l'unité
objhelp.b.text=Le script qui tourne pendant la partie, pour chaque exemplaire de l'unité sur la carte. Utilisez-le pour tout ce qui se passe dans le temps : animations et pièces qui bougent, effets au tir, actions répétées (une impulsion toutes les 5 secondes), réactions aux dégâts ou à la mort. Une copie démarre avec le script de l'unité originale de BAR, prêt à être modifié.<br><br>Exemple : toutes les 5 secondes, l'unité blesse tout ce qui l'entoure.
objhelp.d.title=DEFINITION : ce qu'est l'unité
objhelp.d.text=La description que le jeu lit une seule fois, au chargement de la partie : vie, coût, vitesse, vue, armes, boucliers, type de déplacement. Vous la modifiez avec de courtes commandes du Studio (Studio.set, Studio.addWeapon, Studio.addShield, Studio.moveLike). Le bouton Components permet de choisir armes, boucliers et valeurs parmi les unités de BAR et écrit les lignes pour vous.<br><br>Exemple : donner à l'unité le bouclier plasma d'une autre unité.
objhelp.rule.title=COMMENT CHOISIR
objhelp.rule.text=Un nombre ou un équipement va dans Definition. Ce qui se passe pendant le jeu va dans Behaviour. Si vous ajoutez une arme dans Definition et voulez une façon particulière de tirer, la partie tir va dans Behaviour.
objhelp.close=Fermer
objhint.script=Behaviour : ce que fait l'unité pendant la partie (animations, effets, actions répétées).
objhint.def=Definition : ce qu'est l'unité au chargement de la partie (vie, armes, boucliers, déplacement).
