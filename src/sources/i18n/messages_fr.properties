relief.title=3. MODELAGE (TEMPS RÉEL)
relief.hint=Les curseurs remodèlent le terrain d'origine pendant que vous les déplacez. Revenir à 0 le restaure.
relief.profile=Profil du relief
relief.profile.tooltip=Négatif : plaines plus larges et sommets plus aigus. Positif : plateaux et vallées étroites.
relief.smooth=Lissage
relief.smooth.tooltip=Adoucit progressivement tout le terrain.
relief.terraces=Terrasses (niveaux)
relief.terraces.tooltip=Transforme les pentes en gradins. 0 = désactivé ; chaque gradin garde une rampe étroite.
relief.erosion=Érosion
relief.erosion.tooltip=La matière glisse des pentes raides : falaises adoucies, crêtes plus naturelles.
relief.detail=Détail fin
relief.detail.tooltip=Ajoute de petites irrégularités. Elles sont en miroir, la symétrie de la carte est donc conservée.
relief.border=Hauteur des bords
relief.border.tooltip=Négatif : abaisse le bord de la carte (mer ouverte). Positif : le relève (murs, falaises).
relief.reset=Réinitialiser le modelage
relief.reset.tooltip=Remet tous les curseurs de modelage à 0 et restaure le terrain d'origine
specx.relief.title=Modelage du relief en temps réel (onglet Relief)
specx.relief.body=> Hauteur maximale et niveau de l'eau ont chacun un curseur : le terrain est régénéré pendant le déplacement.\n> Curseurs de modelage : profil du relief, lissage, terrasses (2-12 niveaux), érosion, détail fin, hauteur des bords.\n> Ils agissent toujours sur le terrain d'origine, donc les effets ne s'accumulent pas ; à 0 il redevient comme avant.\n> Générer, importer, charger une heightmap ou lisser les pentes fixe un nouveau terrain de départ et remet les curseurs à zéro.\n> Après les terrasses, vérifiez la carte des pentes [L] : les gradins sont raides.
specx.import.title=Importer une carte BAR existante
specx.import.body=> « Importer une carte BAR... » charge un .sd7/.sdz comme base modifiable : terrain, texture de couleur (réduite), positions de départ, points de métal, geysers, éclairage et eau.\n> Non importés : arbres, rochers et épaves, textures de détail de l'auteur, effets spéciaux.\n> La texture de couleur est importée au quart de la résolution, le terrain réexporté est donc plus flou de près.\n> Une carte importée reste l'œuvre de son auteur : vérifiez sa licence avant de la republier.
specx.biome.title=Biomes BAR (menu Biome / Texture)
specx.biome.body=> Les entrées commençant par « BAR: » viennent de cartes officielles de BAR : palette du terrain (plaine, altitude, pentes, roche, rivage, fond), éclairage, atmosphère et eau.\n> Elles ne contiennent que des couleurs et des nombres, aucune texture des auteurs ; la carte d'origine est inscrite dans mapinfo.lua.\n> Si des matériaux de zone du panneau Texture sont appliqués, ils priment sur les couleurs du biome ; éclairage et eau restent.
specx.options.title=Options de la carte, joueurs et rôles des spawns
specx.options.body=> Joueurs par équipe (1-8) : le générateur crée une position de départ par joueur, chacune d'une couleur différente.\n> Options de la carte : pas de brouillard de guerre, métal/énergie de départ supplémentaires, terrain non déformable, gravité, dégâts de l'eau, eau masquée, vent, marée, rayon des extracteurs, carte de nuit, lave ou acide à la place de l'eau (niveau, dégâts, marée).\n> Rôles des spawns (front, air, sea, tech) : BAR les affiche sous forme de cercles étiquetés avant la partie. Ils sont écrits dans le script de lancement et fonctionnent donc quand la partie est lancée depuis BAR Map Studio ; pour les lobbies en ligne, la carte doit figurer dans maps-metadata de BAR (un fichier YAML prêt est enregistré dans la carte exportée, dans mapconfig/).
specx.defaults.title=Objets fournis avec le programme
specx.defaults.body=> Chaque sous-dossier de « default_objects/ » dans le dossier du programme qui contient un .obj (avec son .mtl et, au besoin, un script .lua du même nom) est chargé au démarrage comme objet prêt.\n> Pour ajouter votre propre objet fourni, créez un nouveau sous-dossier avec ces fichiers : rien d'autre n'est nécessaire.
