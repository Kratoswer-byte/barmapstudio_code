join.readme=Partie sur la carte {0}\n\n1. Envoyez à chaque ami le fichier à son nom : join_NOM.bat pour Windows, join_NOM.sh pour Linux et Mac (non testé).\n2. L''ami ouvre le fichier par un double clic : il télécharge la carte, la place dans BAR et rejoint votre partie.\n   Windows peut avertir que le fichier a été téléchargé : Informations complémentaires, puis Exécuter quand même.\n3. Vous hébergez : BAR démarre sur votre PC et attend les autres.\n\nAdresse de la partie : {1}, port UDP {2}. Ce port doit arriver à votre PC (redirection sur le routeur ou réseau privé).\nTout le monde doit avoir le même moteur de BAR que vous : {3}. Il suffit d''ouvrir BAR une fois pour le mettre à jour.\nLes fichiers contiennent le mot de passe de la partie : envoyez-les uniquement à vos amis.\n
