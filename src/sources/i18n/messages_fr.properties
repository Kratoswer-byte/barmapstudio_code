zm.1=MATÉRIAUX EXTERNES - SPÉCIFICATIONS\n
zm.2=Un matériau est un groupe de fichiers de même nom de base, dans le même dossier\n
zm.3=(conseillé : custom_assets/textures). On le charge en choisissant le fichier COULEUR.\n
zm.4=\  laine.png           COULEUR (obligatoire)\n
zm.5=\  laine_normal.png    NORMAL MAP (facultatif)\n
zm.6=\  laine_height.png    RELIEF en niveaux de gris (facultatif)\n
zm.7=\  laine.properties    PARAMÈTRES (facultatif)\n
zm.8=PACKS PBR PRÊTS À L'EMPLOI (ambientCG, Poly Haven)\n
zm.9=Ils se chargent tels quels, en choisissant le fichier _Color : sont reconnus\n
zm.10=_Color, _NormalGL (ou _NormalDX, convertie), _Displacement (relief) et\n
zm.11=_Roughness (dont on estime la brillance). Le relief réel reste désactivé tant que\n
zm.12=vous ne réglez pas relief_elmos dans <nom>.properties.\n
zm.13=RÈGLES POUR LES IMAGES\n
zm.14=- Format : PNG, JPG ou BMP.\n
zm.15=- Carrées, côté en puissance de 2 : 256, 512, 1024 ou 2048.\n
zm.16=- Répétables sans raccord (seamless) : le bord droit doit se prolonger dans le gauche,\n
zm.17=\  et le bord haut dans le bas.\n
zm.18=- Couleur : sans ombres ni lumières directionnelles, le moteur les ajoute lui-même.\n
zm.19=- Normal map : espace tangent, convention OpenGL (vert = haut), même répétition que la couleur.\n
zm.20=\  Si elle manque, elle est calculée depuis le relief ou la luminosité de la couleur.\n
zm.21=- Relief : gris moyen = altitude inchangée, blanc = élève, noir = abaisse.\n
zm.22=PARAMÈTRES (fichier .properties, tous facultatifs)\n
zm.23=\  tile_elmos=128      côté d'une répétition sur le terrain, en elmos (16 - 2048)\n
zm.24=\  gloss=0.05          brillance : 0 = mat (laine), 0.6 = plastique brillant (Lego)\n
zm.25=\  relief_elmos=0      dénivelé du relief réel en elmos, du point le plus bas au plus haut\n
zm.26=\  normal_strength=2   force de la normal map (1 = comme dans le fichier, jusqu'à 8)\n
zm.27=LIMITES DU JEU\n
zm.28=- La couleur en jeu a 1 pixel par elmo : une tuile de 1024 px sur 128 elmos est réduite.\n
zm.29=- Le relief réel a 1 point tous les 8 elmos : il faut tile_elmos d'au moins 64 et des formes larges d'au moins\n
zm.30=\  40-50 elmos. Les unités le ressentent : un relief raide les ralentit ou les bloque.\n
zm.31=- Le détail fin (fibres, bords) vient de la normal map, pas du relief.\n
zm.32=\ semble être l'aperçu du pack : utilisation de 
zm.33=\ comme couleur.
zm.34=relief_elmos > 0 mais il manque 
zm.35=_height : aucun relief appliqué.
zm.36=Relief avec tile_elmos < 64 : le terrain a un point tous les 8 elmos, le relief sera ignoré.
zm.37=Impossible de lire 
zm.38=: elle n'est pas carrée (
zm.39=), elle sera déformée.
zm.40=: le côté n'est pas une puissance de 2 (
zm.41=: plus grande que 2048 px, le détail en excès ne se voit pas en jeu.
zm.42=\ n'est pas numérique : "
# --- spec
spec.1=Ne plus afficher au démarrage
spec.2=SPÉCIFICATIONS & GUIDE DES ASSETS : BEYOND ALL REASON
spec.3=SPÉCIFICATIONS & GUIDE DES ASSETS : BEYOND ALL REASON (RECOIL ENGINE)
spec.4=HEIGHTMAP & RELIEF
spec.5=TEXTURE & TERRAIN
spec.6=MODÈLES 3D & FLORE
spec.7=MÉTAL & ENVIRONNEMENT
spec.8=DOSSIER DES ASSETS
spec.9=SPÉCIFICATIONS D'ALTIMÉTRIE ET DE HEIGHTMAP (RECOIL ENGINE)
spec.10=Format principal
spec.11=PNG 16 bits en niveaux de gris ou RAW 16 bits
spec.12=Profondeur de couleur
spec.13=65 536 niveaux de gris (0 - 65535)
spec.14=Formule de résolution
spec.15=Pente max des chars
spec.16=jusqu'à ~27 degrés (movedef 18 x 1.5) ; conseillé < 20
spec.17=Pente max des bots
spec.18=jusqu'à ~54 degrés (movedef 36 x 1.5) ; conseillé < 33
spec.19=Résolutions standard pour BAR
spec.20=> Carte 8x8 km (1v1 / 2v2) : 513 x 513 pixels (ou 512x512)\n
spec.21=> Carte 16x16 km (8v8 compétitif standard) : 1025 x 1025 pixels (ou 1024x1024)\n
spec.22=> Carte 24x24 km (grande échelle) : 1537 x 1537 pixels\n
spec.23=> Carte 32x32 km (guerre totale) : 2049 x 2049 pixels\n\n
spec.24=Remarque : si vous importez des images d'une autre résolution (par ex. 2000x2000 ou 1920x1080), BAR Map Studio applique automatiquement un rééchantillonnage bicubique qui préserve les dénivelés.
spec.25=POURQUOI LE FORMAT 16 BITS EST ESSENTIEL :\n
spec.26=Une image 8 bits classique ne dispose que de 256 niveaux. Sur un dénivelé de 300 mètres, chaque marche dépasse 1,17 mètre, ce qui crée des terrasses en escalier (« stepping/banding ») qui bloquent les véhicules de BAR.\n
spec.27=Le 16 bits offre 65 536 altitudes différentes (4,5 millimètres par niveau), ce qui garantit des rampes parfaitement lisses et un pathfinding fluide pour tous les véhicules.
spec.28=ERREURS COURANTES À ÉVITER :\n
spec.29=[!] Pentes verticales accidentelles : utilisez toujours l'outil Carte des pentes [L] pour vérifier que les rampes d'accès aux bases ne dépassent pas 22 degrés pour les chars.\n
spec.30=[!] Pics isolés sous l'eau : les fonds marins doivent être plats ou en pente douce pour laisser passer aéroglisseurs et sous-marins.
spec.31=SPÉCIFICATIONS DES TEXTURES DE SURFACE ET DU SPLATTING
spec.32=Résolution des tuiles
spec.33=Format du diffuse global
spec.34=DDS compressé BC1/DXT1 ou PNG 24 bits
spec.35=Normales de détail (DNTS)
spec.36=TGA 32 bits non compressé (1024x1024)
spec.37=Masque de splatting
spec.38=DDS BC3/DXT5 à 4 canaux RGBA
spec.39=Seamless (répétition continue sans raccord)
spec.40=Les 4 canaux du masque de splatting (_splats.dds)
spec.41=Le shader de terrain de Beyond All Reason fusionne 4 textures de micro-détail (DNTS) via les canaux de la carte de splatting :\n
spec.42=> Canal R (Rouge) : Matériau 1 (terrain de base, herbe, plaine)\n
spec.43=> Canal G (Vert) : Matériau 2 (parois rocheuses, falaises, escarpements verticaux)\n
spec.44=> Canal B (Bleu) : Matériau 3 (sable, gravier, fond marin ou littoral)\n
spec.45=> Canal A (Alpha) : Matériau 4 (neige, boue, fissures ou poussière d'altitude)\n\n
spec.46=Les valeurs vont de 0 à 255 et le shader calcule automatiquement la transition douce entre les couches.
spec.47=DETAIL NORMAL & TEXTURE (fichiers _dnts1..4.tga) :\n
spec.48=Résolution standard : 1024x1024 pixels. Les canaux contiennent :\n
spec.49=- R (Rouge) = Vecteur normal tangent X (nx)\n
spec.50=- G (Vert) = Vecteur normal tangent Y (ny)\n
spec.51=- B (Bleu) = Vecteur normal tangent Z (nz = 1.0)\n
spec.52=- Alpha (transparence) = Carte de hauteur et de rugosité du micro-détail (détail passe-haut)
spec.53=Matériaux externes pour les 4 zones (panneau Texture, bouton + Fichier)
spec.54=Un matériau est un groupe de fichiers de même nom de base dans le même dossier. On le charge en choisissant le fichier de couleur.\n
spec.55=> nom.png : COULEUR (obligatoire). Sans ombres ni lumières peintes.\n
spec.56=> nom_normal.png : NORMAL MAP (facultatif), espace tangent OpenGL. Calculée automatiquement si absente.\n
spec.57=> nom_height.png : RELIEF en niveaux de gris (facultatif). Gris moyen = altitude inchangée, blanc élève, noir abaisse.\n
spec.58=> nom.properties : PARAMÈTRES (facultatif) : tile_elmos (16-2048, défaut 128), gloss (0-1, défaut 0.05), relief_elmos (0-64, défaut 0).\n
spec.59=> Images carrées, côté en puissance de 2 (256-2048), répétables sans raccord.\n
spec.60=> gloss : 0 = mat (laine), 0.6 = plastique brillant (Lego).\n
spec.61=> Relief réel : le terrain a un point tous les 8 elmos, il faut donc tile_elmos d'au moins 64 et des formes larges de 40-50 elmos. Les unités le ressentent.\n
spec.62=> À l'export, la couleur est composée à pleine résolution (1 pixel par elmo) à partir des masques et des matériaux.
spec.63=ERREURS COURANTES SUR LES TEXTURES :\n
spec.64=[!] Noirs purs (#000000) ou blancs purs (#FFFFFF) : ils écrasent la lumière solaire du shader de BAR et rendent les ombres plates ou brûlées.\n
spec.65=[!] Tailles qui ne sont pas des puissances de 2 : le GPU ne peut pas générer de mipmaps pour des tailles irrégulières (par ex. 1000x1000), d'où des artefacts visuels à distance.
spec.66=SPÉCIFICATIONS DES MODÈLES 3D, DE LA FLORE ET DES ÉPAVES (FEATURES)
spec.67=Format 3D natif
spec.68=Spring .s3o (convertible depuis .OBJ)
spec.69=Flore (Arbres/Arbustes)
spec.70=150 - 500 triangles (max 800)
spec.71=Rochers & Blocs
spec.72=Grandes épaves / Repères
spec.73=Atlas de textures
spec.74=Puissance de 2 (512, 1024, 2048) : TGA/PNG ou DDS
spec.75=Import OBJ : comment le modèle arrive en jeu
spec.76=BAR ne lit ni les fichiers .mtl ni les textures map_Kd : le Studio convertit l'OBJ en .s3o (objects3d/) avec UNE seule paire de textures dans unittextures/.\n
spec.77=> Matériaux à couleur seule (Kd) : ils deviennent une palette de couleurs.\n
spec.78=> Matériaux avec image (map_Kd) : ils sont fusionnés en un seul atlas ; gardez .obj, .mtl et images dans le même dossier.\n
spec.79=> Géométrie : axe Y vers le haut. Le Studio centre le modèle et pose sa base au sol (Y = 0).\n
spec.80=> Échelle : 1 case d'empreinte = 16 elmos. Champ d'échelle de 0.01 à 500.
spec.81=CANAUX DES DEUX TEXTURES (règle du shader de BAR) :\n
spec.82=- tex1 RGB : couleur du modèle.\n
spec.83=- tex1 Alpha : quantité de COULEUR D'ÉQUIPE. 0 = couleurs d'origine, 255 = modèle entièrement à la couleur de l'équipe.\n
spec.84=- tex2 R : émission (lumières), G : métal, B : rugosité.\n
spec.85=- tex2 Alpha : opacité. Doit valoir 255 là où le modèle est visible.\n
spec.86=- UV : v = 0 est le bord HAUT de l'image (inverse de l'OBJ ; le Studio inverse tout seul).\n
spec.87=- Normal map (facultative) : fichier <nom tex1>_normals ou customParams.normaltex.
spec.88=Statique ou dynamique
spec.89=> STATIQUE (feature) : rochers, ruines, décorations, épaves. Fichier features/<id>.lua, pas d'équipe, pas d'animation. Le nom ne doit pas contenir _dead ni _heap.\n
spec.90=> DYNAMIQUE (unité) : tourelles, bâtiments qui tournent, objets interactifs. Fichier units/<id>.lua plus un script dans scripts/<id>.lua.\n
spec.91=> Animations : dans BAR elles ne sont pas squelettiques. Ce sont des mouvements de PIÈCES rigides (base, tourelle, canon...) commandés par le script avec Turn, Move, Spin, Hide, Show. Chaque pièce tourne autour de sa propre origine.\n
spec.92=> Pièces : chaque objet de l'OBJ (dans Blender : un objet par partie, par ex. body, left_arm, right_arm) devient une pièce animable. La racine est 'body' et le pivot des autres est leur point d'attache au corps.\n
spec.93=> Script : si modele.lua se trouve à côté de modele.obj, il est chargé automatiquement à l'import.\n
spec.94=> Arme : une ligne de commentaire dans le script, par ex.  --@weapon missile range=900 reload=2.5 damage=120  (missile = à tête chercheuse, rocket = va tout droit).\n> Indestructible : la ligne de commentaire  --@invulnerable  dans le script rend l'unité insensible à toute arme (D-gun compris), non capturable et non recyclable.
spec.95=Budget de polygones : pourquoi il est crucial dans BAR
spec.96=Une carte compétitive typique de Beyond All Reason contient entre 5 000 et 20 000 arbres et formations rocheuses.\n
spec.97=Si un seul arbre comptait 3 000 polygones, le moteur devrait afficher jusqu'à 60 MILLIONS de triangles rien que pour la végétation, provoquant des chutes de FPS dévastatrices.\n
spec.98=Utilisez des géométries low-poly avec des atlas de textures bien planifiés et confiez les détails à la normal map.
spec.99=SCHÉMA DE DÉFINITION LUA (features/<nom_feature>.lua) :\n
spec.100=Chaque objet 3D doit avoir un script .lua d'accompagnement avec les paramètres clés suivants :\n
spec.101=- name : chaîne d'identification unique\n
spec.102=- object : nom du fichier .s3o relatif à objects3d/, avec extension (par ex. 'pine_tree.s3o')\n
spec.103=- blocking : true (bloque le mouvement) / false (écrasable par les chars)\n
spec.104=- reclaimable : true (les constructeurs peuvent absorber métal/énergie)\n
spec.105=- energy : valeur d'énergie extractible (par ex. 40-70 pour les arbres)\n
spec.106=- metal : valeur de métal extractible (par ex. 100-300 pour les épaves)\n
spec.107=- damage : points de vie avant destruction\n
spec.108=- flammable : true s'il peut prendre feu (la clé 'burnable' est ignorée)\n
spec.109=- footprintX / footprintZ : encombrement en cases de grille (1 empreinte = 16x16 elmos)
spec.110=CONSEILS SUR LES UV ET LES MATÉRIAUX :\n
spec.111=[!] Plusieurs textures séparées pour un seul arbre : utilisez un seul atlas pour le tronc et les feuilles afin de réduire les draw calls au minimum.\n
spec.112=[!] Normales non inversées : le Recoil Engine utilise des normal maps en espace tangent avec l'axe Y orienté comme OpenGL.
spec.113=SPÉCIFICATIONS DES RESSOURCES (MÉTAL) ET DE MAPINFO.LUA
spec.114=Résolution de la metalmap
spec.115=1 pixel pour 16x16 elmos (grille 1:16)
spec.116=Valeur de métal des mex
spec.117=0 - 255 (standard BAR : ~180 - 255)
spec.118=Distance minimale entre mex
spec.119=48 - 64 elmos (évite le chevauchement des cercles)
spec.120=Vent standard
spec.121=Min : 4 - 6 | Max : 18 - 25
spec.122=Gravité du jeu
spec.123=Cartes exportées : 100 (réglable dans Options de la carte)
spec.124=Équilibrage stratégique des points de métal (mex)
spec.125=> Base de départ : en général 3 ou 4 points mex (valeur 1,5 - 2,0 métal/s) défendables à moins de 150 elmos du spawn du Commandant.\n
spec.126=> Expansion naturelle : 2 ou 3 points mex à moyenne distance qui encouragent la lutte pour le territoire.\n
spec.127=> Points stratégiques au centre : spots à haut rendement (valeur 3,0 - 5,0 métal/s ou geovent) sur des hauteurs ou dans des gorges pour récompenser l'agressivité.\n
spec.128=> Symétrie absolue : en match compétitif, les positions et la valeur totale de métal doivent être parfaitement symétriques (axe X, Z ou diagonale).
spec.129=ÉCLAIRAGE ET SOLEIL (dans mapinfo.lua) :\n
spec.130=- Élévation solaire optimale : entre 35 et 55 degrés au-dessus de l'horizon. Elle crée de longues ombres qui mettent en valeur canyons et escarpements sans assombrir les bases.\n
spec.131=- Rapport lumière/ombre : lumière ambiante ~0,35-0,45 pour garder les unités bien lisibles même dans les gorges profondes.
spec.132=EAU (bloc 'water' de mapinfo.lua) :\n
spec.133=- L'eau n'est PAS une texture de la carte : le moteur la dessine lui-même comme un plan à l'altitude 0.\n
spec.134=- Tout le terrain sous l'altitude 0 est submergé ; la texture de la carte ne couvre que le fond.\n
spec.135=- Couleur et transparence se règlent dans mapinfo.lua (surfaceColor, surfaceAlpha, absorb, baseColor, planeColor).\n
spec.136=- La zone « Côte / Plage » du panneau Texture peint la bande autour du niveau de l'eau.
spec.137=STRUCTURE DES DOSSIERS POUR LES ASSETS PERSONNALISÉS
spec.138=BAR Map Studio comprend un dossier 'custom_assets/' à la racine de l'application où déposer vos fichiers personnels :\n\n
spec.139=[DIR] custom_assets/\n
spec.140=\  |-- [DIR] heightmaps/  -> Déposez ici vos images de relief PNG 16 bits ou RAW\n
spec.141=\  |-- [DIR] textures/    -> Déposez ici textures diffuse, normales et masques splat\n
spec.142=\  `-- [DIR] features/    -> Déposez ici les modèles 3D (.obj avec son .mtl) et les scripts (.lua)\n\n
spec.143=Comment ils sont utilisés :\n
spec.144=1. Les heightmaps se chargent avec le bouton « Charger une heightmap... » de l'onglet Relief de la barre latérale gauche.\n
spec.145=2. Les textures chargées remplacent le sol dans l'aperçu en temps réel et sont intégrées aux tuiles exportées.\n
spec.146=3. Les modèles et objets 3D sont ajoutés automatiquement à l'archive .sdz autonome de la carte lors de l'export final pour Beyond All Reason.
spec.147=OUVRIR LE DOSSIER 'custom_assets' DANS L'EXPLORATEUR WINDOWS
spec.148=Impossible d'ouvrir le dossier custom_assets :\n
spec.149=Erreur
spec.150=Ouvrir le dossier Custom Assets
spec.151=Fermer
