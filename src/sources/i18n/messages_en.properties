# --- zm
zm.1=EXTERNAL MATERIALS - SPECS\n
zm.2=A material is a group of files with the same base name, in the same folder\n
zm.3=(recommended: custom_assets/textures). Load it by picking the COLOUR file.\n
zm.4=\  wool.png            COLOUR (required)\n
zm.5=\  wool_normal.png     NORMAL MAP (optional)\n
zm.6=\  wool_height.png     greyscale RELIEF (optional)\n
zm.7=\  wool.properties     PARAMETERS (optional)\n
zm.8=READY-MADE PBR PACKS (ambientCG, Poly Haven)\n
zm.9=They load as they are, by picking the _Color file: the loader recognises\n
zm.10=_Color, _NormalGL (or _NormalDX, converted), _Displacement (relief) and\n
zm.11=_Roughness (used to estimate the gloss). Real relief stays off until\n
zm.12=you set relief_elmos in <name>.properties.\n
zm.13=IMAGE RULES\n
zm.14=- Format: PNG, JPG or BMP.\n
zm.15=- Square, side a power of 2: 256, 512, 1024 or 2048.\n
zm.16=- Repeatable without seams (seamless): the right edge must continue into the left one,\n
zm.17=\  and the top edge into the bottom one.\n
zm.18=- Colour: no shadows or directional lights, the engine adds them itself.\n
zm.19=- Normal map: tangent space, OpenGL convention (green = up), same repetition as the colour.\n
zm.20=\  If missing it is derived from the relief or from the brightness of the colour.\n
zm.21=- Relief: mid grey = unchanged height, white = raise, black = lower.\n
zm.22=PARAMETERS (.properties file, all optional)\n
zm.23=\  tile_elmos=128      side of one repetition on the terrain, in elmos (16 - 2048)\n
zm.24=\  gloss=0.05          gloss: 0 = matte (wool), 0.6 = glossy plastic (Lego)\n
zm.25=\  relief_elmos=0      height span of the real relief in elmos, from the lowest to the highest point\n
zm.26=\  normal_strength=2   strength of the normal map (1 = as in the file, up to 8)\n
zm.27=GAME LIMITS\n
zm.28=- In-game colour has 1 pixel per elmo: a 1024 px tile over 128 elmos is scaled down.\n
zm.29=- Real relief has 1 point every 8 elmos: you need tile_elmos of at least 64 and shapes at least\n
zm.30=\  40-50 elmos wide. Units feel it: steep relief slows or blocks them.\n
zm.31=- Fine detail (fibres, edges) comes from the normal map, not from the relief.\n
zm.32=\ looks like the preview of the pack: using 
zm.33=\ as colour.
zm.34=relief_elmos > 0 but missing 
zm.35=_height: no relief applied.
zm.36=Relief with tile_elmos < 64: the terrain has one point every 8 elmos, the relief will be ignored.
zm.37=Unable to read 
zm.38=: it is not square (
zm.39=), it will be distorted.
zm.40=: the side is not a power of 2 (
zm.41=: larger than 2048 px, the extra detail is not visible in game.
zm.42=\ is not a number: "
# --- spec
spec.1=Do not show again at startup
spec.2=ASSET SPECS & GUIDE: BEYOND ALL REASON
spec.3=ASSET SPECS & GUIDE: BEYOND ALL REASON (RECOIL ENGINE)
spec.4=HEIGHTMAP & RELIEF
spec.5=TEXTURE & TERRAIN
spec.6=3D MODELS & FLORA
spec.7=METAL & ENVIRONMENT
spec.8=ASSET FOLDER
spec.9=ELEVATION AND HEIGHTMAP SPECS (RECOIL ENGINE)
spec.10=Primary Format
spec.11=16-bit greyscale PNG or 16-bit RAW
spec.12=Colour Depth
spec.13=65,536 grey levels (0 - 65535)
spec.14=Resolution Formula
spec.15=Max Tank Slope
spec.16=up to ~27 degrees (movedef 18 x 1.5); recommended < 20
spec.17=Max Bot Slope
spec.18=up to ~54 degrees (movedef 36 x 1.5); recommended < 33
spec.19=Standard Resolutions for BAR
spec.20=> 8x8 km map (1v1 / 2v2): 513 x 513 pixels (or 512x512)\n
spec.21=> 16x16 km map (standard competitive 8v8): 1025 x 1025 pixels (or 1024x1024)\n
spec.22=> 24x24 km map (large scale): 1537 x 1537 pixels\n
spec.23=> 32x32 km map (total war): 2049 x 2049 pixels\n\n
spec.24=Note: if you import images with a different resolution (e.g. 2000x2000 or 1920x1080), BAR Map Studio automatically applies bicubic resampling that preserves the height differences.
spec.25=WHY THE 16-BIT FORMAT IS ESSENTIAL:\n
spec.26=A conventional 8-bit image has only 256 discrete levels. Over a 300 metre height difference each step is more than 1.17 metres, producing terraced steps ('stepping/banding') that trap BAR vehicles.\n
spec.27=16-bit offers 65,536 different heights (4.5 millimetres per level), giving perfectly smooth ramps and fluid pathfinding for every vehicle.
spec.28=COMMON MISTAKES TO AVOID:\n
spec.29=[!] Accidental vertical slopes: always use the Slope Map tool [L] to check that the ramps into the bases do not exceed 22 degrees for tanks.\n
spec.30=[!] Isolated peaks under water: the sea bed must be flat or gently sloping so hovercraft and submarines can pass.
spec.31=SURFACE TEXTURE AND SPLATTING SPECS
spec.32=Tile Resolution
spec.33=Global Diffuse Format
spec.34=Compressed DDS BC1/DXT1 or 24-bit PNG
spec.35=Detail Normals (DNTS)
spec.36=Uncompressed 32-bit TGA (1024x1024)
spec.37=Splatting Mask
spec.38=DDS BC3/DXT5 with 4 RGBA channels
spec.39=Seamless (continuous repetition without seams)
spec.40=The 4 Channels of the Splatting Mask (_splats.dds)
spec.41=The Beyond All Reason terrain shader blends 4 micro-detail textures (DNTS) through the channels of the splatting map:\n
spec.42=> R channel (Red): Material 1 (base terrain, grass, plains)\n
spec.43=> G channel (Green): Material 2 (rock walls, cliffs, vertical escarpments)\n
spec.44=> B channel (Blue): Material 3 (sand, gravel, sea bed or shoreline)\n
spec.45=> A channel (Alpha): Material 4 (snow, mud, cracks or high-altitude dust)\n\n
spec.46=Values range from 0 to 255 and the shader computes the soft transition between the layers automatically.
spec.47=DETAIL NORMAL & TEXTURE (files _dnts1..4.tga):\n
spec.48=Standard resolution: 1024x1024 pixels. The channels contain:\n
spec.49=- R (Red) = Tangent normal vector X (nx)\n
spec.50=- G (Green) = Tangent normal vector Y (ny)\n
spec.51=- B (Blue) = Tangent normal vector Z (nz = 1.0)\n
spec.52=- Alpha (transparency) = Micro-detail height and roughness map (high-pass detail)
spec.53=External Materials for the 4 Zones (Texture panel, + File button)
spec.54=A material is a group of files with the same base name in the same folder. Load it by picking the colour file.\n
spec.55=> name.png: COLOUR (required). No painted shadows or lights.\n
spec.56=> name_normal.png: NORMAL MAP (optional), OpenGL tangent space. Derived automatically if missing.\n
spec.57=> name_height.png: greyscale RELIEF (optional). Mid grey = unchanged height, white raises, black lowers.\n
spec.58=> name.properties: PARAMETERS (optional): tile_elmos (16-2048, default 128), gloss (0-1, default 0.05), relief_elmos (0-64, default 0).\n
spec.59=> Square images, side a power of 2 (256-2048), repeatable without seams.\n
spec.60=> gloss: 0 = matte (wool), 0.6 = glossy plastic (Lego).\n
spec.61=> Real relief: the terrain has one point every 8 elmos, so you need tile_elmos of at least 64 and shapes 40-50 elmos wide. Units feel it.\n
spec.62=> On export the colour is composed at full resolution (1 pixel per elmo) from masks and materials.
spec.63=COMMON TEXTURE MISTAKES:\n
spec.64=[!] Pure blacks (#000000) or pure whites (#FFFFFF): they override the sunlight of the BAR shader and make shadows flat or burnt out.\n
spec.65=[!] Sizes that are not powers of 2: the GPU cannot build mipmaps for odd sizes (e.g. 1000x1000), causing visual artefacts at a distance.
spec.66=3D MODEL, FLORA AND WRECK SPECS (FEATURES)
spec.67=Native 3D Format
spec.68=Spring .s3o (convertible from .OBJ)
spec.69=Flora (Trees/Shrubs)
spec.70=150 - 500 triangles (max 800)
spec.71=Rocks & Boulders
spec.72=Large Wrecks / Landmarks
spec.73=Texture Atlas
spec.74=Power of 2 (512, 1024, 2048): TGA/PNG or DDS
spec.75=OBJ import: how the model reaches the game
spec.76=BAR does not read .mtl files or map_Kd textures: the Studio converts the OBJ into an .s3o (objects3d/) with ONE pair of textures in unittextures/.\n
spec.77=> Colour-only materials (Kd): they become a colour palette.\n
spec.78=> Materials with an image (map_Kd): they are merged into a single atlas; keep .obj, .mtl and images in the same folder.\n
spec.79=> Geometry: Y axis up. The Studio centres the model and rests its base on the ground (Y = 0).\n
spec.80=> Scale: 1 footprint square = 16 elmos. Scale field from 0.01 to 500.
spec.81=CHANNELS OF THE TWO TEXTURES (BAR shader rule):\n
spec.82=- tex1 RGB: colour of the model.\n
spec.83=- tex1 Alpha: amount of TEAM COLOUR. 0 = original colours, 255 = model entirely in team colour.\n
spec.84=- tex2 R: emission (lights), G: metal, B: roughness.\n
spec.85=- tex2 Alpha: opacity. It must be 255 wherever the model is visible.\n
spec.86=- UV: v = 0 is the TOP edge of the image (opposite of OBJ; the Studio flips it for you).\n
spec.87=- Normal map (optional): file <tex1 name>_normals or customParams.normaltex.
spec.88=Static or Dynamic
spec.89=> STATIC (feature): rocks, ruins, decorations, wrecks. File features/<id>.lua, no team, no animation. The name must not contain _dead or _heap.\n
spec.90=> DYNAMIC (unit): turrets, rotating buildings, interactive objects. File units/<id>.lua plus a script in scripts/<id>.lua.\n
spec.91=> Animations: in BAR they are not skeletal. They are movements of rigid PIECES (base, turret, barrel...) driven by the script with Turn, Move, Spin, Hide, Show. Each piece rotates around its own origin.\n
spec.92=> Pieces: each object of the OBJ (in Blender: one object per part, e.g. body, left_arm, right_arm) becomes an animatable piece. The root is 'body' and the pivot of the others is where they attach to the body.\n
spec.93=> Script: if model.lua sits next to model.obj it is loaded automatically on import.\n
spec.94=> Weapon: one comment line in the script, e.g.  --@weapon missile range=900 reload=2.5 damage=120  (missile = homing, rocket = flies straight).\n> Indestructible: the comment line  --@invulnerable  in the script makes the unit immune to every weapon (D-gun included), not capturable and not reclaimable.
spec.95=Polygon Budget: Why It Is Crucial in BAR
spec.96=A typical competitive Beyond All Reason map holds between 5,000 and 20,000 trees and rock formations.\n
spec.97=If a single tree had 3,000 polygons, the engine would have to render up to 60 MILLION triangles for the vegetation alone, causing devastating FPS drops.\n
spec.98=Use low-poly geometry with well planned texture atlases and leave the detail to the normal map.
spec.99=LUA DEFINITION SCHEMA (features/<feature_name>.lua):\n
spec.100=Every 3D object needs an accompanying .lua script with these key parameters:\n
spec.101=- name: unique identifying string\n
spec.102=- object: name of the .s3o file relative to objects3d/, with extension (e.g. 'pine_tree.s3o')\n
spec.103=- blocking: true (blocks movement) / false (can be crushed by tanks)\n
spec.104=- reclaimable: true (builders can absorb metal/energy)\n
spec.105=- energy: extractable energy value (e.g. 40-70 for trees)\n
spec.106=- metal: extractable metal value (e.g. 100-300 for wrecks)\n
spec.107=- damage: hit points before destruction\n
spec.108=- flammable: true if it can catch fire (the key 'burnable' is ignored)\n
spec.109=- footprintX / footprintZ: size in grid squares (1 footprint = 16x16 elmos)
spec.110=TIPS ON UVS AND MATERIALS:\n
spec.111=[!] Several separate textures for one tree: use a single texture atlas for trunk and leaves to keep draw calls to a minimum.\n
spec.112=[!] Non-inverted normals: the Recoil Engine uses tangent-space normal maps with OpenGL-style Y axis orientation.
spec.113=RESOURCE (METAL) AND MAPINFO.LUA SPECS
spec.114=Metalmap Resolution
spec.115=1 pixel per 16x16 elmos (1:16 grid)
spec.116=Mex Metal Value
spec.117=0 - 255 (BAR standard: ~180 - 255)
spec.118=Minimum Mex Distance
spec.119=48 - 64 elmos (avoids overlapping circles)
spec.120=Standard Wind
spec.121=Min: 4 - 6 | Max: 18 - 25
spec.122=Game Gravity
spec.123=Exported maps: 100 (adjustable in Map options)
spec.124=Strategic Balance of Metal Spots (Mex)
spec.125=> Starting base: usually 3 or 4 mex spots (value 1.5 - 2.0 metal/sec) defensible within 150 elmos of the Commander spawn.\n
spec.126=> Natural expansion: 2 or 3 mex spots at medium distance that encourage fighting for territory.\n
spec.127=> Strategic points in the centre: high-yield spots (value 3.0 - 5.0 metal/sec or geovent) on heights or in gorges to reward aggression.\n
spec.128=> Absolute symmetry: in competitive matches the positions and total metal value must be perfectly mirrored (X axis, Z axis or diagonal).
spec.129=LIGHTING AND SUN (in mapinfo.lua):\n
spec.130=- Best sun elevation: between 35 and 55 degrees above the horizon. It casts long, evocative shadows that bring out canyons and escarpments without darkening the bases.\n
spec.131=- Light/shadow ratio: ambient light ~0.35-0.45 so units stay fully readable even in deep gorges.
spec.132=WATER ('water' block of mapinfo.lua):\n
spec.133=- Water is NOT a map texture: the engine draws it by itself as a plane at height 0.\n
spec.134=- All terrain below height 0 is submerged; the map texture only covers the sea bed.\n
spec.135=- Colour and transparency are set in mapinfo.lua (surfaceColor, surfaceAlpha, absorb, baseColor, planeColor).\n
spec.136=- The 'Coast / Beach' zone of the Texture panel paints the band around the water level.
spec.137=FOLDER STRUCTURE FOR CUSTOM ASSETS
spec.138=BAR Map Studio includes a 'custom_assets/' folder in the application root where you can drop your own files:\n\n
spec.139=[DIR] custom_assets/\n
spec.140=\  |-- [DIR] heightmaps/  -> Put your 16-bit PNG or RAW relief images here\n
spec.141=\  |-- [DIR] textures/    -> Put diffuse textures, normals and splat masks here\n
spec.142=\  `-- [DIR] features/    -> Put 3D models (.obj with its .mtl) and scripts (.lua) here\n\n
spec.143=How they are used:\n
spec.144=1. Heightmaps are loaded with the 'Load Heightmap...' button in the Relief tab of the left sidebar.\n
spec.145=2. Loaded textures replace the ground in the preview in real time and are packed into the exported tiles.\n
spec.146=3. 3D models and objects are added automatically to the map's self-contained .sdz archive during the final export for Beyond All Reason.
spec.147=OPEN THE 'custom_assets' FOLDER IN WINDOWS EXPLORER
spec.148=Unable to open the custom_assets folder:\n
spec.149=Error
spec.150=Open Custom Assets Folder
spec.151=Close
