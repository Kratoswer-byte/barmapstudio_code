objhelp.button.tip=What is the difference between Behaviour and Definition?
objhelp.title=Behaviour and Definition
objhelp.intro=A custom unit has two Lua texts. They are read at two different moments and do two different jobs. Both exist only for your copies: the original BAR units can only be viewed.
objhelp.b.title=BEHAVIOUR: what the unit does
objhelp.b.text=The script that runs during the match, for every copy of the unit on the map. Use it for everything that happens over time: animations and moving pieces, effects when it fires, actions that repeat (a pulse every 5 seconds), reactions to damage or death. A copy starts with the script of the original BAR unit, ready to be changed.<br><br>Example: every 5 seconds the unit damages everything around it.
objhelp.d.title=DEFINITION: what the unit is
objhelp.d.text=The description the game reads once, when the match loads: health, cost, speed, sight, weapons, shields, type of movement. You change it with short Studio commands (Studio.set, Studio.addWeapon, Studio.addShield, Studio.moveLike). The Components button lets you pick weapons, shields and values from the BAR units and writes the lines for you.<br><br>Example: give the unit the plasma shield of another unit.
objhelp.rule.title=HOW TO CHOOSE
objhelp.rule.text=A number or a piece of equipment goes in Definition. Something that happens while playing goes in Behaviour. If you add a weapon in Definition and want a special way of firing it, the firing part goes in Behaviour.
objhelp.close=Close
objhint.script=Behaviour: what the unit does during the match (animations, effects, repeated actions).
objhint.def=Definition: what the unit is when the match loads (health, weapons, shields, movement).
