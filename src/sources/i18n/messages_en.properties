join.readme=Match on the map {0}\n\n1. Send each friend the file with their name: join_NAME.bat for Windows, join_NAME.sh for Linux and Mac (not tested).\n2. The friend opens the file with a double click: it downloads the map, puts it into BAR and joins your match.\n   Windows may warn about a downloaded file: More info, then Run anyway.\n3. You are the host: BAR starts on your PC and waits for the others.\n\nAddress of the match: {1}, UDP port {2}. That port must reach your PC (router forwarding or a private network).\nEverybody needs the same BAR engine as you: {3}. Opening BAR once updates it.\nThe join files contain the match password: send them to your friends only.\n
