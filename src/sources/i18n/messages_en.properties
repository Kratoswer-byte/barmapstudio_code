relief.title=3. TERRAIN SHAPING (LIVE)
relief.hint=The sliders reshape the original terrain while you move them. Back to 0 restores it.
relief.profile=Relief profile
relief.profile.tooltip=Negative: wider plains and sharper peaks. Positive: plateaus and narrow valleys.
relief.smooth=Smoothing
relief.smooth.tooltip=Softens the whole terrain gradually.
relief.terraces=Terraces (levels)
relief.terraces.tooltip=Turns slopes into steps. 0 = off; each step keeps a narrow ramp.
relief.erosion=Erosion
relief.erosion.tooltip=Material slides down from steep slopes: softer cliffs, more natural ridges.
relief.detail=Fine detail
relief.detail.tooltip=Adds small irregularities. They are mirrored, so map symmetry is kept.
relief.border=Border height
relief.border.tooltip=Negative: lowers the map edge (open sea). Positive: raises it (walls, cliffs).
relief.reset=Reset shaping
relief.reset.tooltip=Set all shaping sliders back to 0 and restore the original terrain
specx.relief.title=Live terrain shaping (Relief tab)
specx.relief.body=> Maximum height and water level have a slider each: the terrain is regenerated while you move it.\n> Shaping sliders: relief profile, smoothing, terraces (2-12 levels), erosion, fine detail, border height.\n> They always work on the original terrain, so effects do not pile up; back to 0 restores it.\n> Generating, importing, loading a heightmap or smoothing slopes sets a new starting terrain and resets the sliders.\n> After terraces, check the Slope Map [L]: steps are steep.
specx.import.title=Importing an existing BAR map
specx.import.body=> 'Import BAR map...' loads a .sd7/.sdz as an editable base: terrain, colour texture (reduced), start positions, metal spots, geo vents, lighting and water.\n> Not imported: trees, rocks and wrecks, the author's detail textures, special effects.\n> The colour texture is imported at a quarter of the resolution, so the re-exported terrain is softer up close.\n> An imported map remains the work of its author: check its licence before republishing.
specx.biome.title=BAR biomes (Biome / Texture menu)
specx.biome.body=> The entries starting with 'BAR:' come from official BAR maps: terrain palette (plains, heights, slopes, rock, shore, sea bed), lighting, atmosphere and water.\n> They contain only colours and numbers, no textures by the map authors; the source map is written into mapinfo.lua.\n> If zone materials from the Texture panel are applied, they take priority over the biome colours; lighting and water stay.
specx.options.title=Map options, players and spawn roles
specx.options.body=> Players per team (1-8): the generator creates one start position per player, with a different colour each.\n> Map options: no fog of war, extra starting metal/energy, non-deformable terrain, gravity, water damage, hidden water, wind, tide, extractor radius, night map, lava or acid instead of water (level, damage, tide).\n> Spawn roles (front, air, sea, tech): BAR shows them as labelled circles before the match. They are written into the start script, so they work when the match is started from BAR Map Studio; for online lobbies the map must be listed in BAR maps-metadata (a ready YAML file is saved in the exported map under mapconfig/).
specx.defaults.title=Objects shipped with the program
specx.defaults.body=> Every subfolder of 'default_objects/' in the program folder that contains an .obj (with its .mtl and, optionally, a .lua script with the same name) is loaded at startup as a ready object.\n> To add your own built-in object, create a new subfolder with those files: no other setup is needed.
