relief.detail=Feindetail
relief.detail.tooltip=Fügt kleine Unebenheiten hinzu. Sie sind gespiegelt, die Kartensymmetrie bleibt erhalten.
relief.border=Randhöhe
relief.border.tooltip=Negativ: senkt den Kartenrand (offenes Meer). Positiv: hebt ihn an (Mauern, Klippen).
relief.reset=Formung zurücksetzen
relief.reset.tooltip=Setzt alle Formungsregler auf 0 und stellt das ursprüngliche Gelände wieder her
specx.relief.title=Geländeformung in Echtzeit (Reiter Relief)
specx.relief.body=> Maximale Höhe und Wasserspiegel haben je einen Regler: Das Gelände wird beim Bewegen neu erzeugt.\n> Formungsregler: Reliefprofil, Glättung, Terrassen (2-12 Stufen), Erosion, Feindetail, Randhöhe.\n> Sie wirken immer auf das ursprüngliche Gelände, die Effekte summieren sich nicht; bei 0 ist es wie zuvor.\n> Erzeugen, Importieren, Heightmap laden oder Hänge glätten setzt ein neues Ausgangsgelände und die Regler zurück.\n> Prüfe nach Terrassen die Hangkarte [L]: Die Stufen sind steil.
specx.import.title=Vorhandene BAR-Karte importieren
specx.import.body=> „BAR-Karte importieren...“ lädt eine .sd7/.sdz als bearbeitbare Basis: Gelände, Farbtextur (verkleinert), Startpositionen, Metallpunkte, Geysire, Licht und Wasser.\n> Nicht importiert: Bäume, Felsen und Wracks, Detailtexturen des Autors, Spezialeffekte.\n> Die Farbtextur wird mit einem Viertel der Auflösung importiert, das neu exportierte Gelände ist aus der Nähe weicher.\n> Eine importierte Karte bleibt das Werk ihres Autors: Prüfe die Lizenz vor einer Neuveröffentlichung.
specx.biome.title=BAR-Biome (Menü Biom / Textur)
specx.biome.body=> Einträge mit „BAR:“ stammen aus offiziellen BAR-Karten: Geländepalette (Ebene, Höhe, Hänge, Fels, Ufer, Grund), Licht, Atmosphäre und Wasser.\n> Sie enthalten nur Farben und Zahlen, keine Texturen der Autoren; die Ursprungskarte wird in mapinfo.lua vermerkt.\n> Zonenmaterialien aus dem Textur-Panel haben Vorrang vor den Biomfarben; Licht und Wasser bleiben.
specx.options.title=Kartenoptionen, Spieler und Spawn-Rollen
specx.options.body=> Spieler pro Team (1-8): Der Generator erzeugt je Spieler eine Startposition in eigener Farbe.\n> Kartenoptionen: kein Nebel des Krieges, zusätzliches Startmetall/-energie, nicht verformbares Gelände, Schwerkraft, Wasserschaden, ausgeblendetes Wasser, Wind, Gezeiten, Extraktorradius, Nachtkarte, Lava oder Säure statt Wasser (Höhe, Schaden, Gezeiten).\n> Spawn-Rollen (front, air, sea, tech): BAR zeigt sie vor dem Spiel als beschriftete Kreise. Sie stehen im Startskript und funktionieren daher, wenn das Spiel aus BAR Map Studio gestartet wird; für Online-Lobbys muss die Karte in BAR maps-metadata stehen (eine fertige YAML-Datei liegt in der exportierten Karte unter mapconfig/).
specx.defaults.title=Mitgelieferte Objekte
specx.defaults.body=> Jeder Unterordner von „default_objects/“ im Programmordner, der eine .obj enthält (mit zugehöriger .mtl und optional einem gleichnamigen .lua-Skript), wird beim Start als fertiges Objekt geladen.\n> Für ein eigenes mitgeliefertes Objekt genügt ein neuer Unterordner mit diesen Dateien.
