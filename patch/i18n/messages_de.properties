# --- spec
spec.1=Beim Start nicht mehr anzeigen
spec.2=ASSET-SPEZIFIKATIONEN & LEITFADEN: BEYOND ALL REASON
spec.3=ASSET-SPEZIFIKATIONEN & LEITFADEN: BEYOND ALL REASON (RECOIL ENGINE)
spec.4=HEIGHTMAP & RELIEF
spec.5=TEXTUR & GELÄNDE
spec.6=3D-MODELLE & FLORA
spec.7=METALL & UMGEBUNG
spec.8=ASSET-ORDNER
spec.9=HÖHEN- UND HEIGHTMAP-SPEZIFIKATIONEN (RECOIL ENGINE)
spec.10=Hauptformat
spec.11=16-Bit-Graustufen-PNG oder 16-Bit-RAW
spec.12=Farbtiefe
spec.13=65.536 Graustufen (0 - 65535)
spec.14=Auflösungsformel
spec.15=Max. Hang für Panzer
spec.16=bis ~27 Grad (movedef 18 x 1.5); empfohlen < 20
spec.17=Max. Hang für Bots
spec.18=bis ~54 Grad (movedef 36 x 1.5); empfohlen < 33
spec.19=Standardauflösungen für BAR
spec.20=> 8x8-km-Karte (1v1 / 2v2): 513 x 513 Pixel (oder 512x512)\n
spec.21=> 16x16-km-Karte (Standard-8v8-Wettkampf): 1025 x 1025 Pixel (oder 1024x1024)\n
spec.22=> 24x24-km-Karte (großer Maßstab): 1537 x 1537 Pixel\n
spec.23=> 32x32-km-Karte (totaler Krieg): 2049 x 2049 Pixel\n\n
spec.24=Hinweis: Wenn du Bilder mit anderer Auflösung importierst (z. B. 2000x2000 oder 1920x1080), wendet BAR Map Studio automatisch ein bikubisches Resampling an, das die Höhenunterschiede erhält.
spec.25=WARUM DAS 16-BIT-FORMAT UNVERZICHTBAR IST:\n
spec.26=Ein gewöhnliches 8-Bit-Bild hat nur 256 Stufen. Bei 300 Metern Höhenunterschied misst jede Stufe über 1,17 Meter und erzeugt Terrassen („Stepping/Banding“), an denen BAR-Fahrzeuge hängen bleiben.\n
spec.27=16 Bit bietet 65.536 verschiedene Höhen (4,5 Millimeter pro Stufe) und damit völlig glatte Rampen und flüssige Wegfindung für alle Fahrzeuge.
spec.28=HÄUFIGE FEHLER, DIE MAN VERMEIDEN SOLLTE:\n
spec.29=[!] Versehentliche senkrechte Hänge: Prüfe mit dem Werkzeug Hangkarte [L] immer, dass die Rampen zu den Basen 22 Grad für Panzer nicht überschreiten.\n
spec.30=[!] Einzelne Spitzen unter Wasser: Der Meeresboden muss flach oder sanft abfallend sein, damit Hovercraft und U-Boote passieren können.
spec.31=SPEZIFIKATIONEN FÜR OBERFLÄCHENTEXTUREN UND SPLATTING
spec.32=Kachelauflösung
spec.33=Globales Diffuse-Format
spec.34=Komprimiertes DDS BC1/DXT1 oder 24-Bit-PNG
spec.35=Detail-Normalen (DNTS)
spec.36=Unkomprimiertes 32-Bit-TGA (1024x1024)
spec.37=Splatting-Maske
spec.38=DDS BC3/DXT5 mit 4 RGBA-Kanälen
spec.39=Seamless (nahtlose Wiederholung)
spec.40=Die 4 Kanäle der Splatting-Maske (_splats.dds)
spec.41=Der Gelände-Shader von Beyond All Reason mischt 4 Mikrodetail-Texturen (DNTS) über die Kanäle der Splatting-Karte:\n
spec.42=> R-Kanal (Rot): Material 1 (Grundgelände, Gras, Ebene)\n
spec.43=> G-Kanal (Grün): Material 2 (Felswände, Klippen, senkrechte Steilhänge)\n
spec.44=> B-Kanal (Blau): Material 3 (Sand, Kies, Meeresboden oder Ufer)\n
spec.45=> A-Kanal (Alpha): Material 4 (Schnee, Schlamm, Risse oder Hochlagenstaub)\n\n
spec.46=Die Werte reichen von 0 bis 255, und der Shader berechnet den weichen Übergang zwischen den Schichten automatisch.
spec.47=DETAIL-NORMAL & TEXTUR (Dateien _dnts1..4.tga):\n
spec.48=Standardauflösung: 1024x1024 Pixel. Die Kanäle enthalten:\n
spec.49=- R (Rot) = Tangenten-Normalenvektor X (nx)\n
spec.50=- G (Grün) = Tangenten-Normalenvektor Y (ny)\n
spec.51=- B (Blau) = Tangenten-Normalenvektor Z (nz = 1.0)\n
spec.52=- Alpha (Transparenz) = Höhen- und Rauheitskarte des Mikrodetails (Hochpass-Detail)
spec.53=Externe Materialien für die 4 Zonen (Textur-Panel, Schaltfläche + Datei)
spec.54=Ein Material ist eine Gruppe von Dateien mit gleichem Basisnamen im selben Ordner. Man lädt es über die Farbdatei.\n
spec.55=> name.png: FARBE (Pflicht). Ohne gemalte Schatten oder Lichter.\n
spec.56=> name_normal.png: NORMAL-MAP (optional), OpenGL-Tangentenraum. Wird bei Fehlen automatisch abgeleitet.\n
spec.57=> name_height.png: RELIEF in Graustufen (optional). Mittelgrau = Höhe unverändert, Weiß hebt, Schwarz senkt.\n
spec.58=> name.properties: PARAMETER (optional): tile_elmos (16-2048, Standard 128), gloss (0-1, Standard 0.05), relief_elmos (0-64, Standard 0).\n
spec.59=> Quadratische Bilder, Seitenlänge eine Zweierpotenz (256-2048), nahtlos wiederholbar.\n
spec.60=> gloss: 0 = matt (Wolle), 0.6 = glänzender Kunststoff (Lego).\n
spec.61=> Echtes Relief: Das Gelände hat alle 8 Elmos einen Punkt, nötig sind tile_elmos von mindestens 64 und 40-50 Elmos breite Formen. Einheiten spüren es.\n
spec.62=> Beim Export wird die Farbe in voller Auflösung (1 Pixel pro Elmo) aus Masken und Materialien zusammengesetzt.
spec.63=HÄUFIGE TEXTURFEHLER:\n
spec.64=[!] Reines Schwarz (#000000) oder reines Weiß (#FFFFFF): Sie überschreiben das Sonnenlicht des BAR-Shaders und machen Schatten flach oder ausgebrannt.\n
spec.65=[!] Größen, die keine Zweierpotenzen sind: Die GPU kann für krumme Größen (z. B. 1000x1000) keine Mipmaps erzeugen, was aus der Ferne zu Bildfehlern führt.
spec.66=SPEZIFIKATIONEN FÜR 3D-MODELLE, FLORA UND WRACKS (FEATURES)
spec.67=Natives 3D-Format
spec.68=Spring .s3o (aus .OBJ konvertierbar)
spec.69=Flora (Bäume/Sträucher)
spec.70=150 - 500 Dreiecke (max. 800)
spec.71=Felsen & Blöcke
spec.72=Große Wracks / Landmarken
spec.73=Texturatlas
spec.74=Zweierpotenz (512, 1024, 2048): TGA/PNG oder DDS
spec.75=OBJ-Import: wie das Modell ins Spiel kommt
spec.76=BAR liest weder .mtl-Dateien noch map_Kd-Texturen: Das Studio wandelt das OBJ in ein .s3o (objects3d/) mit EINEM Texturpaar in unittextures/ um.\n
spec.77=> Materialien nur mit Farbe (Kd): Sie werden zu einer Farbpalette.\n
spec.78=> Materialien mit Bild (map_Kd): Sie werden zu einem Atlas zusammengefügt; halte .obj, .mtl und Bilder im selben Ordner.\n
spec.79=> Geometrie: Y-Achse nach oben. Das Studio zentriert das Modell und setzt seine Basis auf den Boden (Y = 0).\n
spec.80=> Skalierung: 1 Grundflächenfeld = 16 Elmos. Skalierungsfeld von 0.01 bis 500.
spec.81=KANÄLE DER BEIDEN TEXTUREN (Regel des BAR-Shaders):\n
spec.82=- tex1 RGB: Farbe des Modells.\n
spec.83=- tex1 Alpha: Anteil der TEAMFARBE. 0 = Originalfarben, 255 = Modell vollständig in Teamfarbe.\n
spec.84=- tex2 R: Emission (Lichter), G: Metall, B: Rauheit.\n
spec.85=- tex2 Alpha: Deckkraft. Muss 255 sein, wo das Modell sichtbar ist.\n
spec.86=- UV: v = 0 ist die OBERE Bildkante (umgekehrt zu OBJ; das Studio dreht es selbst um).\n
spec.87=- Normal-Map (optional): Datei <tex1-Name>_normals oder customParams.normaltex.
spec.88=Statisch oder dynamisch
spec.89=> STATISCH (Feature): Felsen, Ruinen, Dekoration, Wracks. Datei features/<id>.lua, kein Team, keine Animation. Der Name darf weder _dead noch _heap enthalten.\n
spec.90=> DYNAMISCH (Einheit): Geschütztürme, drehende Gebäude, interaktive Objekte. Datei units/<id>.lua plus ein Skript in scripts/<id>.lua.\n
spec.91=> Animationen: In BAR gibt es keine Skelettanimation. Es sind Bewegungen starrer TEILE (Basis, Turm, Rohr...), gesteuert vom Skript mit Turn, Move, Spin, Hide, Show. Jedes Teil dreht sich um seinen eigenen Ursprung.\n
spec.92=> Teile: Jedes Objekt des OBJ (in Blender: ein Objekt pro Teil, z. B. body, left_arm, right_arm) wird zu einem animierbaren Teil. Die Wurzel ist 'body', der Drehpunkt der anderen liegt an ihrer Verbindung zum Körper.\n
spec.93=> Skript: Liegt modell.lua neben modell.obj, wird es beim Import automatisch geladen.\n
spec.94=> Waffe: eine Kommentarzeile im Skript, z. B.  --@weapon missile range=900 reload=2.5 damage=120  (missile = zielsuchend, rocket = fliegt geradeaus).\n> Unzerstörbar: Die Kommentarzeile  --@invulnerable  im Skript macht die Einheit immun gegen jede Waffe (auch D-Gun), nicht einnehmbar und nicht verwertbar.
spec.95=Polygonbudget: Warum es in BAR entscheidend ist
spec.96=Eine typische Wettkampfkarte von Beyond All Reason enthält 5.000 bis 20.000 Bäume und Felsformationen.\n
spec.97=Hätte ein einzelner Baum 3.000 Polygone, müsste die Engine allein für die Vegetation bis zu 60 MILLIONEN Dreiecke rendern und die FPS würden dramatisch einbrechen.\n
spec.98=Nutze Low-Poly-Geometrie mit gut geplanten Texturatlanten und überlasse die Details der Normal-Map.
spec.99=LUA-DEFINITIONSSCHEMA (features/<feature_name>.lua):\n
spec.100=Jedes 3D-Objekt braucht ein begleitendes .lua-Skript mit diesen Schlüsselparametern:\n
spec.101=- name: eindeutige Kennzeichnung\n
spec.102=- object: Name der .s3o-Datei relativ zu objects3d/, mit Endung (z. B. 'pine_tree.s3o')\n
spec.103=- blocking: true (blockiert Bewegung) / false (von Panzern überfahrbar)\n
spec.104=- reclaimable: true (Bauer können Metall/Energie aufnehmen)\n
spec.105=- energy: gewinnbarer Energiewert (z. B. 40-70 für Bäume)\n
spec.106=- metal: gewinnbarer Metallwert (z. B. 100-300 für Wracks)\n
spec.107=- damage: Trefferpunkte bis zur Zerstörung\n
spec.108=- flammable: true, wenn es Feuer fangen kann (der Schlüssel 'burnable' wird ignoriert)\n
spec.109=- footprintX / footprintZ: Größe in Rasterfeldern (1 Grundfläche = 16x16 Elmos)
spec.110=TIPPS ZU UVS UND MATERIALIEN:\n
spec.111=[!] Mehrere getrennte Texturen für einen Baum: Nutze einen einzigen Texturatlas für Stamm und Blätter, um Draw Calls zu minimieren.\n
spec.112=[!] Nicht invertierte Normalen: Die Recoil Engine nutzt Tangentenraum-Normal-Maps mit Y-Achse nach OpenGL-Konvention.
spec.113=SPEZIFIKATIONEN FÜR RESSOURCEN (METALL) UND MAPINFO.LUA
spec.114=Metalmap-Auflösung
spec.115=1 Pixel je 16x16 Elmos (Raster 1:16)
spec.116=Mex-Metallwert
spec.117=0 - 255 (BAR-Standard: ~180 - 255)
spec.118=Mindestabstand der Mexe
spec.119=48 - 64 Elmos (vermeidet überlappende Kreise)
spec.120=Standardwind
spec.121=Min: 4 - 6 | Max: 18 - 25
spec.122=Spielschwerkraft
spec.123=Exportierte Karten: 100 (in den Kartenoptionen einstellbar)
spec.124=Strategische Balance der Metallpunkte (Mex)
spec.125=> Startbasis: meist 3 oder 4 Mex-Punkte (Wert 1,5 - 2,0 Metall/s), verteidigbar innerhalb von 150 Elmos um den Commander-Spawn.\n
spec.126=> Natürliche Expansion: 2 oder 3 Mex-Punkte in mittlerer Entfernung, die den Kampf ums Gebiet fördern.\n
spec.127=> Strategische Punkte in der Mitte: ertragreiche Spots (Wert 3,0 - 5,0 Metall/s oder Geovent) auf Höhen oder in Schluchten, um Aggression zu belohnen.\n
spec.128=> Absolute Symmetrie: In Wettkampfspielen müssen Positionen und Gesamtmetallwert exakt gespiegelt sein (X-Achse, Z-Achse oder Diagonale).
spec.129=BELEUCHTUNG UND SONNE (in mapinfo.lua):\n
spec.130=- Beste Sonnenhöhe: zwischen 35 und 55 Grad über dem Horizont. Sie erzeugt lange, stimmungsvolle Schatten, die Canyons und Steilhänge betonen, ohne die Basen zu verdunkeln.\n
spec.131=- Licht-Schatten-Verhältnis: Umgebungslicht ~0,35-0,45, damit Einheiten auch in tiefen Schluchten gut lesbar bleiben.
spec.132=WASSER ('water'-Block der mapinfo.lua):\n
spec.133=- Wasser ist KEINE Kartentextur: Die Engine zeichnet es selbst als Ebene auf Höhe 0.\n
spec.134=- Alles Gelände unter Höhe 0 ist überflutet; die Kartentextur bedeckt nur den Grund.\n
spec.135=- Farbe und Transparenz werden in mapinfo.lua eingestellt (surfaceColor, surfaceAlpha, absorb, baseColor, planeColor).\n
spec.136=- Die Zone „Küste / Strand“ im Textur-Panel bemalt das Band um den Wasserspiegel.
spec.137=ORDNERSTRUKTUR FÜR EIGENE ASSETS
spec.138=BAR Map Studio enthält im Anwendungsverzeichnis einen Ordner 'custom_assets/', in dem du eigene Dateien ablegen kannst:\n\n
spec.139=[DIR] custom_assets/\n
spec.140=\  |-- [DIR] heightmaps/  -> Lege hier deine 16-Bit-PNG- oder RAW-Reliefbilder ab\n
spec.141=\  |-- [DIR] textures/    -> Lege hier Diffuse-Texturen, Normalen und Splat-Masken ab\n
spec.142=\  `-- [DIR] features/    -> Lege hier 3D-Modelle (.obj mit zugehöriger .mtl) und Skripte (.lua) ab\n\n
spec.143=So werden sie verwendet:\n
spec.144=1. Heightmaps werden über „Heightmap laden...“ im Reiter Relief der linken Seitenleiste geladen.\n
spec.145=2. Geladene Texturen ersetzen den Boden in der Vorschau in Echtzeit und werden in die exportierten Kacheln gepackt.\n
spec.146=3. 3D-Modelle und Objekte werden beim finalen Export für Beyond All Reason automatisch in das eigenständige .sdz-Archiv der Karte aufgenommen.
spec.147=ORDNER 'custom_assets' IM WINDOWS-EXPLORER ÖFFNEN
spec.148=Ordner custom_assets kann nicht geöffnet werden:\n
spec.149=Fehler
spec.150=Custom-Assets-Ordner öffnen
spec.151=Schließen
