zm.1=EXTERNE MATERIALIEN - SPEZIFIKATION\n
zm.2=Ein Material ist eine Gruppe von Dateien mit gleichem Basisnamen im selben Ordner\n
zm.3=(empfohlen: custom_assets/textures). Man lädt es über die FARB-Datei.\n
zm.4=\  wolle.png           FARBE (Pflicht)\n
zm.5=\  wolle_normal.png    NORMAL-MAP (optional)\n
zm.6=\  wolle_height.png    RELIEF in Graustufen (optional)\n
zm.7=\  wolle.properties    PARAMETER (optional)\n
zm.8=FERTIGE PBR-PAKETE (ambientCG, Poly Haven)\n
zm.9=Sie werden unverändert geladen, über die _Color-Datei: erkannt werden\n
zm.10=_Color, _NormalGL (oder _NormalDX, umgerechnet), _Displacement (Relief) und\n
zm.11=_Roughness (daraus wird der Glanz geschätzt). Echtes Relief bleibt aus, bis\n
zm.12=du relief_elmos in <name>.properties setzt.\n
zm.13=REGELN FÜR DIE BILDER\n
zm.14=- Format: PNG, JPG oder BMP.\n
zm.15=- Quadratisch, Seitenlänge eine Zweierpotenz: 256, 512, 1024 oder 2048.\n
zm.16=- Nahtlos wiederholbar (seamless): Der rechte Rand muss in den linken übergehen,\n
zm.17=\  der obere in den unteren.\n
zm.18=- Farbe: ohne Schatten oder gerichtetes Licht, die Engine fügt sie selbst hinzu.\n
zm.19=- Normal-Map: Tangentenraum, OpenGL-Konvention (Grün = oben), gleiche Wiederholung wie die Farbe.\n
zm.20=\  Fehlt sie, wird sie aus dem Relief oder der Helligkeit der Farbe abgeleitet.\n
zm.21=- Relief: Mittelgrau = Höhe unverändert, Weiß = hebt, Schwarz = senkt.\n
zm.22=PARAMETER (.properties-Datei, alle optional)\n
zm.23=\  tile_elmos=128      Seitenlänge einer Wiederholung auf dem Gelände, in Elmos (16 - 2048)\n
zm.24=\  gloss=0.05          Glanz: 0 = matt (Wolle), 0.6 = glänzender Kunststoff (Lego)\n
zm.25=\  relief_elmos=0      Höhenspanne des echten Reliefs in Elmos, vom tiefsten zum höchsten Punkt\n
zm.26=\  normal_strength=2   Stärke der Normal-Map (1 = wie in der Datei, bis 8)\n
zm.27=GRENZEN DES SPIELS\n
zm.28=- Die Farbe im Spiel hat 1 Pixel pro Elmo: Eine 1024-px-Kachel auf 128 Elmos wird verkleinert.\n
zm.29=- Echtes Relief hat alle 8 Elmos einen Punkt: nötig sind tile_elmos von mindestens 64 und Formen von mindestens\n
zm.30=\  40-50 Elmos Breite. Einheiten spüren es: Steiles Relief bremst oder blockiert sie.\n
zm.31=- Feine Details (Fasern, Kanten) kommen aus der Normal-Map, nicht aus dem Relief.\n
zm.32=\ sieht nach der Vorschau des Pakets aus: verwende 
zm.33=\ als Farbe.
zm.34=relief_elmos > 0, aber es fehlt 
zm.35=_height: kein Relief angewendet.
zm.36=Relief mit tile_elmos < 64: Das Gelände hat alle 8 Elmos einen Punkt, das Relief wird ignoriert.
zm.37=Kann nicht gelesen werden: 
zm.38=: nicht quadratisch (
zm.39=), wird verzerrt.
