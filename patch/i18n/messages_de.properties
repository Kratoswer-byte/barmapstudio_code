join.readme=Spiel auf der Karte {0}\n\n1. Schicke jedem Freund die Datei mit seinem Namen: join_NAME.bat für Windows, join_NAME.sh für Linux und Mac (nicht getestet).\n2. Der Freund öffnet die Datei mit einem Doppelklick: Sie lädt die Karte herunter, legt sie in BAR ab und tritt deinem Spiel bei.\n   Windows warnt eventuell vor der heruntergeladenen Datei: Weitere Informationen, dann Trotzdem ausführen.\n3. Du bist der Host: BAR startet auf deinem PC und wartet auf die anderen.\n\nAdresse des Spiels: {1}, UDP-Port {2}. Dieser Port muss deinen PC erreichen (Weiterleitung am Router oder privates Netz).\nAlle brauchen dieselbe BAR-Engine wie du: {3}. BAR einmal öffnen aktualisiert es.\nDie Beitrittsdateien enthalten das Passwort des Spiels: schicke sie nur deinen Freunden.\n
