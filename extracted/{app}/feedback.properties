# Dove arrivano le segnalazioni inviate dal pulsante FEEDBACK del programma.
#
# feedback_endpoint: indirizzo del modulo a cui il programma spedisce la segnalazione (servizio di moduli che la
#   inoltra per posta all'autore, per esempio https://formsubmit.co/ajax/CODICE oppure https://formspree.io/f/CODICE).
#   L'indirizzo di posta dell'autore NON va scritto qui: lo conosce solo il servizio di moduli.
#   Vuoto = nessun invio: l'utente puo' solo copiare il testo.
# feedback_key: chiave di accesso, solo per i servizi che la richiedono (di norma vuota).
# feedback_url: pagina da aprire nel browser al posto dell'invio diretto (facoltativa).
feedback_endpoint=
feedback_key=
feedback_url=
