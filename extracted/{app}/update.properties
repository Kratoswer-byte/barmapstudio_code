# Aggiornamenti del programma tramite le "release" di un progetto GitHub.
#
# update_repo: il progetto, nella forma utente/progetto (per esempio Kr4Tosw3R/BARMapStudio).
#   Vuoto = nessun controllo. Il progetto deve essere pubblico.
# update_check: false per non controllare mai all'avvio.
#
# Come si pubblica una versione nuova: vedi build/RELEASE.txt nel progetto.
update_repo=
update_check=true
